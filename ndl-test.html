<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDL APIテスト</title>
</head>
<body>
<button onclick="test()">NDLテスト</button>
<pre id="out" style="font-size:11px;word-break:break-all;white-space:pre-wrap"></pre>
<script>
async function test() {
  const out = document.getElementById('out');
  out.textContent = '検索中…';
  try {
    const q = encodeURIComponent('思考の整理学');
    const res = await fetch(`https://ndlsearch.ndl.go.jp/api/opensearch?title=${q}&mediatype=1&cnt=3`);
    const text = await res.text();
    out.textContent = text.slice(0, 3000);
  } catch(e) {
    out.textContent = 'エラー: ' + e;
  }
}
</script>
</body>
</html>
