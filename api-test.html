<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API テスト</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f5f5f5}
button{padding:12px 20px;margin:8px 0;width:100%;border-radius:8px;border:none;background:#4a7a38;color:#fff;font-size:16px;cursor:pointer}
.result{margin:10px 0;padding:12px;border-radius:8px;background:#fff;font-size:14px;line-height:1.6;word-break:break-all}
.ok{border-left:4px solid #4a7}
.ng{border-left:4px solid #c44}
.pending{border-left:4px solid #aaa;color:#aaa}
</style>
</head>
<body>
<h2>📚 書籍API 動作確認</h2>
<p style="font-size:13px;color:#666">各ボタンを押して結果を確認してください</p>

<button onclick="testGoogleBooks()">① Google Books API をテスト</button>
<div id="r1" class="result pending">未実行</div>

<button onclick="testOpenBD()">② OpenBD API をテスト</button>
<div id="r2" class="result pending">未実行</div>

<button onclick="testNDL()">③ 国立国会図書館 API をテスト</button>
<div id="r3" class="result pending">未実行</div>

<button onclick="testAll()">④ 全部まとめてテスト</button>

<script>
async function testGoogleBooks() {
  const el = document.getElementById('r1');
  el.className = 'result pending'; el.textContent = '🔄 テスト中…';
  try {
    const q = encodeURIComponent('思考の整理学');
    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=3`);
    const d = await res.json();
    if (d.items && d.items.length > 0) {
      el.className = 'result ok';
      el.innerHTML = `✅ 成功！${d.items.length}件取得<br>例：${d.items[0].volumeInfo.title}`;
    } else {
      el.className = 'result ng';
      el.textContent = '⚠️ 接続できたが結果0件';
    }
  } catch(e) {
    el.className = 'result ng';
    el.textContent = '❌ エラー: ' + e.message;
  }
}

async function testOpenBD() {
  const el = document.getElementById('r2');
  el.className = 'result pending'; el.textContent = '🔄 テスト中…';
  try {
    const q = encodeURIComponent('思考の整理学');
    const res = await fetch(`https://api.openbd.jp/v1/search?q=${q}&limit=3`);
    const d = await res.json();
    if (d && d.length > 0) {
      el.className = 'result ok';
      el.innerHTML = `✅ 成功！${d.length}件取得<br>例：${d[0]?.summary?.title || '不明'}`;
    } else {
      el.className = 'result ng';
      el.textContent = '⚠️ 接続できたが結果0件';
    }
  } catch(e) {
    el.className = 'result ng';
    el.textContent = '❌ エラー: ' + e.message;
  }
}

async function testNDL() {
  const el = document.getElementById('r3');
  el.className = 'result pending'; el.textContent = '🔄 テスト中…';
  try {
    const q = encodeURIComponent('思考の整理学');
    const res = await fetch(`https://ndlsearch.ndl.go.jp/api/opensearch?title=${q}&mediatype=1&cnt=3`);
    const text = await res.text();
    if (text.includes('<title>')) {
      el.className = 'result ok';
      el.textContent = '✅ 成功！NDL APIに接続できました';
    } else {
      el.className = 'result ng';
      el.textContent = '⚠️ 接続できたが結果なし';
    }
  } catch(e) {
    el.className = 'result ng';
    el.textContent = '❌ エラー: ' + e.message;
  }
}

async function testAll() {
  await testGoogleBooks();
  await testOpenBD();
  await testNDL();
}
</script>
</body>
</html>
